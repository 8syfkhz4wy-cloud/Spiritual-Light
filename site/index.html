  <link rel="stylesheet" href="styles.css">
  <script>
    // Farbwelt sofort setzen (vor dem ersten Bild), damit nichts hell aufblitzt.
    // „Automatisch“ richtet sich nach dem Sonnenstand am Standort: tagsüber Salbei,
    // rund um Sonnenauf- und -untergang Dämmerung, nachts Abend (und immer Abend im Dunkelmodus des Handys).
    (function () {
      var rad = Math.PI / 180;
      function sunTimes(date, lat, lon) {
        var n = (Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 12) - Date.UTC(2000, 0, 1, 12)) / 864e5;
        var j = n - lon / 360;
        var M = (357.5291 + 0.98560028 * j) % 360;
        var C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
        var L = (M + C + 282.9372) % 360;
        var transit = 2451545 + j + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
        var dec = Math.asin(Math.sin(L * rad) * Math.sin(23.4397 * rad));
        var cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(dec)) / (Math.cos(lat * rad) * Math.cos(dec));
        var w = Math.acos(Math.max(-1, Math.min(1, cosW))) / rad;
        var ms = function (jd) { return (jd - 2440587.5) * 864e5; };
        return { rise: ms(transit - w / 360), set: ms(transit + w / 360) };
      }
      function place() {
        try { var p = JSON.parse(localStorage.getItem('spiritual-light:place')); if (p && isFinite(p.lat)) return p; } catch (e) {}
        return { lat: 50.927, lon: 11.586 };
      }
      function autoTheme(now) {
        if (matchMedia('(prefers-color-scheme: dark)').matches) return 'abend';
        var p = place(), t = sunTimes(now, p.lat, p.lon), x = now.getTime(), half = 30 * 60000;
        if (x < t.rise - half || x > t.set + half) return 'abend';
        if (x < t.rise + half || x > t.set - half) return 'daemmerung';
        return 'salbei';
      }
      function pick() {
        var t = 'auto';
        try { t = localStorage.getItem('spiritual-light:theme') || 'auto'; } catch (e) {}
        return t === 'auto' ? autoTheme(new Date()) : t;
      }
      window.SL = { sunTimes: sunTimes, pickTheme: pick };
      var t = pick();
      if (t !== 'hell') document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>

      <!-- Biowetter -->

        </button>
        <h2 class="view-title">Wetter</h2>
        <p class="view-sub" id="wetter-sub">Jena</p>

        <div class="segment" role="tablist" aria-label="Region wählen">
          <button role="tab" class="is-active" data-region="germany" aria-selected="true">Deutschland</button>
          <button role="tab" data-region="jena" aria-selected="false">Jena &amp; Thüringen</button>

      <!-- Bücher -->
      <section class="view" id="view-buecher" aria-labelledby="tab-buecher" hidden>

        <p class="view-sub">Frisch erschienen: Spiritualität, Esoterik &amp; Achtsamkeit</p>
        <div id="books"></div>
      </section>
    </main>

    <footer class="signature">

  <nav class="tabs" aria-label="Rubriken">
    <button id="tab-heute" class="is-active" data-view="heute" aria-current="page">
