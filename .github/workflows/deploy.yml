name: App aktualisieren und veröffentlichen

# Läuft jeden Morgen, holt frische News und neue Bücher und veröffentlicht die App auf GitHub Pages.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # täglich ca. 4:17 Uhr (Winter) bzw. 5:17 Uhr (Sommer) deutscher Zeit
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: News und Bücher aktualisieren
        run: node scripts/update-content.mjs
      # Den neuen Stand speichern: So bleibt bei Ausfällen einer Quelle der letzte gute Stand erhalten,
      # und GitHub pausiert den täglichen Lauf nicht wegen fehlender Aktivität.
      - name: Neuen Stand speichern
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || (git commit -m "Tägliche Aktualisierung: News und Bücher" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
